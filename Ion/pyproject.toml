[project]
name = "ion"
version = "0.1.0"
description = "Ion software for second launch"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyserial>=3.5",
    "pynmeagps==1.1.8",
    "pyrtcm==1.2.1",
    "pyubx2==1.4.1",
    "smbus3==0.5.5",
    "cdh-packets @ git+https://github.com/Orbital-CubeSat-McGill/cdh-cdc-cobs-packets.git@98b32cb29bcef5e9436ce1ae0d2748ba424a4179",
]

[project.optional-dependencies]
olaf = ["oresat-olaf>=3.7.4"]

[project.scripts]
ion = "ion.main:main"
greenbear = "ion.greenbear.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ion"]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Force uv to build PyYAML from source so it compiles C bindings (needed when
# installing the optional olaf extra).
[tool.uv]
no-binary-package = ["pyyaml"]
